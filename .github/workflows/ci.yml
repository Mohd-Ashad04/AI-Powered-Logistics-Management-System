name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json

    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run backend tests
      working-directory: ./backend
      env:
        # Use a GitHub secret for the isolated test database to keep it hidden from logs
        TEST_DATABASE_URI: ${{ secrets.TEST_DATABASE_URI }}
        NODE_ENV: test
        # No production credentials required for tests
      run: npm test

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

    - name: Build backend Docker image (verification)
      working-directory: ./backend
      run: docker build -t ai-logistics-backend:test .

    - name: CI Complete
      run: echo "All tests and builds passed successfully."
